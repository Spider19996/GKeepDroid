name: Build APK

# A tag such as v1.0.0 builds the signed release and publishes it as a GitHub release.
# "Run workflow" in the Actions tab builds a debug APK, or with "signed" ticked a signed release (to test the key).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      signed:
        description: "Build the signed release APK instead of a debug APK"
        type: boolean
        default: false

permissions:
  contents: write # needed to attach the APK to a release

env:
  SIGNED: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.signed }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a Python on the build machine that matches the app's Python (3.13).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@v5

      - name: Point the build at the Python and the Android SDK
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "chaquopy.buildPython=$(which python)"
          } > local.properties

      # Lets Gradle download any missing Android SDK part (the app targets a very recent API level).
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        if: env.SIGNED != 'true'
        run: ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v6
        if: env.SIGNED != 'true'
        with:
          name: gkeepdroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # The key lives in the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD.
      - name: Restore the signing key
        if: env.SIGNED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Spaces and line breaks that crept in while copying the secret do no harm.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.jks"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. Create it with: base64 -w0 gkeepdroid.jks (one line, nothing else)."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The key store cannot be opened with KEYSTORE_PASSWORD and KEY_ALIAS. Check the three secrets."
            exit 1
          fi

      - name: Build the signed release APK
        if: env.SIGNED == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew :app:assembleRelease -Pabis=arm64-v8a --console=plain
          mv app/build/outputs/apk/release/app-release.apk "gkeepdroid-${GITHUB_REF_NAME}.apk"

      - name: Keep the signed APK as a download
        if: env.SIGNED == 'true' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: gkeepdroid-signed-apk
          path: gkeepdroid-*.apk

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gkeepdroid-${{ github.ref_name }}.apk
          generate_release_notes: true

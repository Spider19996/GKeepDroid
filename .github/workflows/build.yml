name: Build APK

# A tag such as v0.2.0 builds the signed release. "Run workflow" in the Actions tab builds a debug APK.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a Python on the build machine that matches the app's Python (3.13).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@v4

      - name: Point the build at the Python and the Android SDK
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "chaquopy.buildPython=$(which python)"
          } > local.properties

      # Lets Gradle download any missing Android SDK part (the app targets a very recent API level).
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: gkeepdroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # A tag such as v0.2.0 builds a signed release APK and publishes it as a GitHub release.
      # The key lives in the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD.
      - name: Build the signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew :app:assembleRelease -Pabis=arm64-v8a --console=plain
          mv app/build/outputs/apk/release/app-release.apk "gkeepdroid-${GITHUB_REF_NAME}.apk"

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gkeepdroid-${{ github.ref_name }}.apk
          generate_release_notes: true
